name: Rotate production deletion credentials

on:
  schedule:
    - cron: "17,37,57 * * * *"
  workflow_dispatch:

concurrency:
  group: production-deletion-credential-rotation
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  rotate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile

      - name: Assume the production deletion credential broker
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-session-name: production-deletion-credential-broker
          role-to-assume: ${{ vars.AWS_DELETION_CREDENTIAL_BROKER_ROLE_ARN }}

      - name: Assume the production Deletion Coordinator role
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-chaining: true
          role-skip-session-tagging: true
          role-session-name: production-deletion-coordinator
          role-to-assume: ${{ vars.AWS_DELETION_COORDINATOR_ROLE_ARN }}

      - name: Rotate the Deletion Coordinator Worker session credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          jq -n \
            --arg access "$AWS_ACCESS_KEY_ID" \
            --arg secret "$AWS_SECRET_ACCESS_KEY" \
            --arg token "$AWS_SESSION_TOKEN" \
            '{AWS_ACCESS_KEY_ID:$access,AWS_SECRET_ACCESS_KEY:$secret,AWS_SESSION_TOKEN:$token}' \
            | bun x wrangler secret bulk \
                --name whatsapp-mcp-deletion-coordinator

      - name: Verify the rotated secret inventory
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          required='AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN'
          actual="$(bun x wrangler secret list \
            --name whatsapp-mcp-deletion-coordinator | jq -r '.[].name')"
          for name in $required; do
            grep -Fxq "$name" <<<"$actual"
          done
