name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.5
      - run: bun install --frozen-lockfile
      - run: bun x playwright install chromium
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run validate:infra
      - run: bun run test:without-db
      - run: bun run build
      - run: bun run manifests:validate
      - run: bun run observability:validate
      - run: bun run infra:validate

  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/4", "2/4", "3/4", "4/4"]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/db test --shard=${{ matrix.shard }}
