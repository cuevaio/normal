name: Production recovery drills

on:
  schedule:
    - cron: "17 3 * * 0"
    - cron: "43 4 1 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      drill:
        description: Drill to execute
        required: true
        type: choice
        options: [weekly_restore, quarterly_game_day]

permissions:
  contents: read

concurrency:
  group: production-operations
  cancel-in-progress: false

jobs:
  weekly-restore:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '17 3 * * 0') ||
      inputs.drill == 'weekly_restore')
    runs-on: ubuntu-latest
    timeout-minutes: 250
    environment: production-recovery
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/run-recovery-drill.ts weekly_restore
        env:
          RECOVERY_AUTOMATION_URL: ${{ secrets.RECOVERY_AUTOMATION_URL }}
          RECOVERY_AUTOMATION_TOKEN: ${{ secrets.RECOVERY_AUTOMATION_TOKEN }}
          RECOVERY_EVIDENCE_PATH: weekly_restore.json
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-restore-evidence
          path: weekly_restore.json
          retention-days: 400

  quarterly-game-day:
    if: >-
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'schedule' && github.event.schedule == '43 4 1 1,4,7,10 *') ||
      inputs.drill == 'quarterly_game_day')
    runs-on: ubuntu-latest
    timeout-minutes: 250
    environment: production-recovery
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun scripts/run-recovery-drill.ts quarterly_game_day
        env:
          AWS_RECOVERY_GAME_DAY_ROLE_ARN: ${{ vars.AWS_RECOVERY_GAME_DAY_ROLE_ARN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KMS_RECOVERY_GAME_DAY_KEY_ARN: ${{ vars.KMS_RECOVERY_GAME_DAY_KEY_ARN }}
          RECOVERY_AUTOMATION_URL: ${{ secrets.RECOVERY_AUTOMATION_URL }}
          RECOVERY_AUTOMATION_TOKEN: ${{ secrets.RECOVERY_AUTOMATION_TOKEN }}
          RECOVERY_EVIDENCE_PATH: quarterly_game_day.json
      - uses: actions/upload-artifact@v4
        with:
          name: quarterly-game-day-evidence
          path: quarterly_game_day.json
          retention-days: 400
