name: Deploy production

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Production operation to execute
        required: true
        default: deploy
        type: choice
        options: [deploy, bootstrap_recovery_secrets]
  workflow_run:
    workflows: [CI]
    types: [completed]

concurrency:
  group: production-operations
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  bootstrap-recovery-secrets:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'bootstrap_recovery_secrets' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - name: Assume recovery game-day authority
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-session-name: production-bootstrap-recovery-game-day
          role-to-assume: ${{ vars.AWS_RECOVERY_GAME_DAY_ROLE_ARN }}
      - name: Populate and verify recovery Worker secrets
        run: bun scripts/bootstrap-recovery-worker-secrets.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          DELETION_MARKER_HMAC_SECRET: ${{ secrets.DELETION_MARKER_HMAC_SECRET }}
          KMS_RECOVERY_GAME_DAY_KEY_ARN: ${{ vars.KMS_RECOVERY_GAME_DAY_KEY_ARN }}
          NEON_PARENT_BRANCH_ID: ${{ secrets.NEON_PARENT_BRANCH_ID }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_RECOVERY_API_KEY: ${{ secrets.NEON_RECOVERY_API_KEY }}
          OBSERVABILITY_QUERY_TOKEN: ${{ secrets.OBSERVABILITY_QUERY_TOKEN }}
          OBSERVABILITY_QUERY_URL: ${{ secrets.OBSERVABILITY_QUERY_URL }}
          PAGER_DESTINATION_ADDRESS: ${{ secrets.PAGER_DESTINATION_ADDRESS }}
          PAGER_RECEIPT_TOKEN: ${{ secrets.PAGER_RECEIPT_TOKEN }}
          PAGER_RECEIPT_URL: ${{ secrets.PAGER_RECEIPT_URL }}
          PAGER_WEBHOOK_TOKEN: ${{ secrets.PAGER_WEBHOOK_TOKEN }}
          PAGER_WEBHOOK_URL: ${{ secrets.PAGER_WEBHOOK_URL }}
          QUARTERLY_RECEIPT_SECRET: ${{ secrets.QUARTERLY_RECEIPT_SECRET }}
          RECIPIENT_TRANSITION_HMAC_SECRET: ${{ secrets.RECIPIENT_TRANSITION_HMAC_SECRET }}
          RECOVERY_CONTROL_TOKEN: ${{ secrets.RECOVERY_CONTROL_TOKEN }}
          RECOVERY_EVIDENCE_TOKEN: ${{ secrets.RECOVERY_EVIDENCE_TOKEN }}
          RECOVERY_VERIFIER_DATABASE_PASSWORD: ${{ secrets.RECOVERY_VERIFIER_DATABASE_PASSWORD }}
          SMOKE_CHECK_SECRET: ${{ secrets.SMOKE_CHECK_SECRET }}

  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.operation == 'deploy' &&
      github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Verify production commit is on main
        run: git merge-base --is-ancestor "$(git rev-parse HEAD)" origin/main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Verify deletion credential rotation authority
        env:
          DELETION_BROKER_ROLE_ARN: ${{ vars.AWS_DELETION_CREDENTIAL_BROKER_ROLE_ARN }}
          DELETION_COORDINATOR_ROLE_ARN: ${{ vars.AWS_DELETION_COORDINATOR_ROLE_ARN }}
        run: |
          test -n "$DELETION_BROKER_ROLE_ARN"
          test -n "$DELETION_COORDINATOR_ROLE_ARN"

      - name: Migrate and verify the production database
        run: bun run db:migrate && bun run db:check
        env:
          MIGRATION_DATABASE_URL: ${{ secrets.MIGRATION_DATABASE_URL }}

      - name: Deploy provider control
        run: bun run --cwd apps/provider-control wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Remove dormant Webshare credential
        run: |
          if bun run --cwd apps/provider-control wrangler secret list --env production --format json | jq -e 'any(.[]; .name == "WEBSHARE_API_KEY")' >/dev/null; then
            bun run --cwd apps/provider-control wrangler secret delete WEBSHARE_API_KEY --env production
          fi
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Assume the production deletion credential broker
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-session-name: production-deploy-deletion-broker
          role-to-assume: ${{ vars.AWS_DELETION_CREDENTIAL_BROKER_ROLE_ARN }}

      - name: Assume the production Deletion Coordinator role
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-chaining: true
          role-skip-session-tagging: true
          role-session-name: production-deploy-deletion-coordinator
          role-to-assume: ${{ vars.AWS_DELETION_COORDINATOR_ROLE_ARN }}

      - name: Rotate Deletion Coordinator credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          jq -n \
            --arg access "$AWS_ACCESS_KEY_ID" \
            --arg secret "$AWS_SECRET_ACCESS_KEY" \
            --arg token "$AWS_SESSION_TOKEN" \
            '{AWS_ACCESS_KEY_ID:$access,AWS_SECRET_ACCESS_KEY:$secret,AWS_SESSION_TOKEN:$token}' \
            | bun x wrangler secret bulk \
                --name whatsapp-mcp-deletion-coordinator

      - name: Deploy deletion coordinator
        run: bun run --cwd apps/deletion-coordinator wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy restore coordinator
        run: bun run --cwd apps/restore-coordinator wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy operations control
        run: |
          mkdir -p apps/operations-control/.wrangler
          bun scripts/render-operations-control-wrangler.ts apps/operations-control/.wrangler/production.jsonc production
          bun run --cwd apps/operations-control wrangler deploy --config .wrangler/production.jsonc --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_OPERATIONS_KV_ID: ${{ vars.CLOUDFLARE_OPERATIONS_KV_ID }}

      - name: Assume recovery game-day authority
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-session-name: production-deploy-recovery-game-day
          role-to-assume: ${{ vars.AWS_RECOVERY_GAME_DAY_ROLE_ARN }}

      - name: Deploy recovery game day
        run: |
          mkdir -p apps/recovery-game-day/.wrangler
          bun scripts/render-recovery-game-day-wrangler.ts apps/recovery-game-day/.wrangler/production.jsonc production
          bun run --cwd apps/recovery-game-day wrangler deploy --config .wrangler/production.jsonc --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_RECOVERY_KV_ID: ${{ vars.CLOUDFLARE_RECOVERY_KV_ID }}

      - name: Rotate recovery game-day credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          KMS_RECOVERY_GAME_DAY_KEY_ARN: ${{ vars.KMS_RECOVERY_GAME_DAY_KEY_ARN }}
        run: |
          jq -n \
            --arg access "$AWS_ACCESS_KEY_ID" \
            --arg secret "$AWS_SECRET_ACCESS_KEY" \
            --arg token "$AWS_SESSION_TOKEN" \
            --arg key "$KMS_RECOVERY_GAME_DAY_KEY_ARN" \
            '{AWS_ACCESS_KEY_ID:$access,AWS_SECRET_ACCESS_KEY:$secret,AWS_SESSION_TOKEN:$token,KMS_RECOVERY_GAME_DAY_KEY_ARN:$key}' \
            | bun x wrangler secret bulk \
                --name whatsapp-mcp-recovery-game-day

      - name: Deploy recovery verifier
        run: bun run --cwd apps/recovery-verifier wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy recovery control
        run: bun run --cwd apps/recovery-control wrangler deploy --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Render production API manifest
        run: bun scripts/render-api-wrangler.ts apps/api/.wrangler/production.jsonc production
        env:
          CLERK_API_AUDIENCE: ${{ vars.API_ORIGIN }}
          CLERK_AUTHORIZED_PARTY: ${{ vars.WEB_ORIGIN }}
          CLERK_ISSUER: ${{ vars.CLERK_ISSUER }}
          CLOUDFLARE_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_HYPERDRIVE_ID }}
          CLOUDFLARE_OAUTH_KV_ID: ${{ vars.CLOUDFLARE_OAUTH_KV_ID }}
          CLOUDFLARE_WEBHOOK_HYPERDRIVE_ID: ${{ vars.CLOUDFLARE_WEBHOOK_HYPERDRIVE_ID }}
          DECRYPTED_MEDIA_BYTES_PER_DAY: ${{ vars.DECRYPTED_MEDIA_BYTES_PER_DAY }}
          MCP_REQUESTS_PER_HOUR: ${{ vars.MCP_REQUESTS_PER_HOUR }}
          MCP_REQUESTS_PER_MINUTE: ${{ vars.MCP_REQUESTS_PER_MINUTE }}
          NEON_BRANCH_ID: ${{ vars.NEON_BRANCH_ID }}
          OAUTH_ISSUER: ${{ vars.API_ORIGIN }}
          OAUTH_RESOURCE: ${{ vars.API_ORIGIN }}/mcp
          READ_MESSAGE_RECORDS_PER_DAY: ${{ vars.READ_MESSAGE_RECORDS_PER_DAY }}
          SENDS_PER_DAY: ${{ vars.SENDS_PER_DAY }}
          SENDS_PER_MINUTE: ${{ vars.SENDS_PER_MINUTE }}

      - name: Assume the production content credential broker
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-session-name: production-deploy-content-broker
          role-to-assume: ${{ vars.AWS_CONTENT_CREDENTIAL_BROKER_ROLE_ARN }}

      - name: Assume the production Content Runtime role
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-chaining: true
          role-skip-session-tagging: true
          role-session-name: production-deploy-content-runtime
          role-to-assume: ${{ vars.AWS_CONTENT_RUNTIME_ROLE_ARN }}

      - name: Rotate API Content Runtime credentials
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          jq -n \
            --arg access "$AWS_ACCESS_KEY_ID" \
            --arg secret "$AWS_SECRET_ACCESS_KEY" \
            --arg token "$AWS_SESSION_TOKEN" \
            '{AWS_ACCESS_KEY_ID:$access,AWS_SECRET_ACCESS_KEY:$secret,AWS_SESSION_TOKEN:$token}' \
            | bun x wrangler secret bulk \
                --name whatsapp-mcp-api

      - name: Deploy API
        run: bun run --cwd apps/api wrangler deploy --config .wrangler/production.jsonc --env production
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy web
        run: bun x vercel@50.39.0 deploy --prod --yes --token "$VERCEL_API_TOKEN"
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

      - name: Deploy docs
        run: bun x vercel@50.39.0 deploy --prod --yes --token "$VERCEL_API_TOKEN"
        env:
          VERCEL_API_TOKEN: ${{ secrets.VERCEL_API_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_DOCS_PROJECT_ID }}

      - name: Smoke production
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          aws-region: us-east-1
          role-session-name: production-mcp-smoke
          role-to-assume: ${{ vars.AWS_MCP_SMOKE_CREDENTIAL_ROLE_ARN }}
      - name: Rotate credential and smoke production
        run: bun run deploy:smoke
        env:
          SMOKE_API_ORIGIN: ${{ vars.API_ORIGIN }}
          SMOKE_CHECK_SECRET: ${{ secrets.SMOKE_CHECK_SECRET }}
          SMOKE_DOCS_ORIGIN: ${{ vars.DOCS_ORIGIN }}
          SMOKE_MCP_REFRESH_SECRET_ID: ${{ vars.MCP_SMOKE_REFRESH_SECRET_ID }}
          SMOKE_WEB_ORIGIN: ${{ vars.WEB_ORIGIN }}
